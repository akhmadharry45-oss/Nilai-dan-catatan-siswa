<body>
<style>
a{color:var(--accent)}
html,body{margin:0}
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld .in{width:100%}
/* Layout: satu kolom sempit seperti buku catatan guru; tab di atas, daftar siswa yang bisa dibuka satu per satu. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F5F8F7; --fg:#13262B; --muted:#586D71; --line:#D2DCDA;
  --accent:#0B6B66; --accent-fg:#FFFFFF;
  --amber:#8F5300; --amber-bg:#FCEFD3;
  --blue:#1B5CA6; --blue-bg:#E1EDFA;
  --red:#B3261E; --red-bg:#FBE4E1;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A1D; --surface:#14262A; --surface2:#112024; --fg:#E4EEED; --muted:#93A9AC; --line:#274045;
    --accent:#5CCBC4; --accent-fg:#06201F;
    --amber:#F2B14C; --amber-bg:#3A2B0E;
    --blue:#8DBBF0; --blue-bg:#14283F;
    --red:#FF9C93; --red-bg:#3F1B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A1D; --surface:#14262A; --surface2:#112024; --fg:#E4EEED; --muted:#93A9AC; --line:#274045;
  --accent:#5CCBC4; --accent-fg:#06201F;
  --amber:#F2B14C; --amber-bg:#3A2B0E;
  --blue:#8DBBF0; --blue-bg:#14283F;
  --red:#FF9C93; --red-bg:#3F1B18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font:700 28px/1.1 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
#stat{font-size:12px;color:var(--muted);min-height:18px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--font-body);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;max-width:100%}
.in:focus{border-color:var(--accent)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.warn{color:var(--red);border-color:var(--red)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sumbar{display:flex;flex-wrap:wrap;gap:8px}
.b{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-t{background:var(--amber-bg);color:var(--amber)}
.b-l{background:var(--blue-bg);color:var(--blue)}
.b-z{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.b-z.hot{background:var(--red-bg);color:var(--red);border-color:transparent}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sis{border-bottom:1px solid var(--line)}
.sis:last-child{border-bottom:0}
.sis-h{width:100%;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:none;border:0;text-align:left;padding:12px 14px;cursor:pointer}
.sis.open .sis-h{background:var(--surface2)}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bd{display:flex;gap:6px;flex-wrap:wrap}
.pn{padding:4px 14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:14px}
.gr{display:flex;flex-direction:column;gap:8px}
.tg{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.tg.on.t{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.tg.on.l{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.ket{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);align-self:flex-start}
.step button{background:none;border:0;width:44px;height:40px;font-size:20px;cursor:pointer}
.step button:hover{background:var(--surface2)}
.step output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.step output.hot{color:var(--red)}
.tw,.tw-top{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tw{overflow-y:visible}
.tw-top{background:var(--surface2);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.tw-top>div{height:1px}
.tw::-webkit-scrollbar,.tw-top::-webkit-scrollbar{height:12px}
.tw::-webkit-scrollbar-track,.tw-top::-webkit-scrollbar-track{background:transparent;margin-inline:8px}
.tw::-webkit-scrollbar-thumb,.tw-top::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:3px solid transparent;background-clip:content-box;min-width:48px}
.tw::-webkit-scrollbar-thumb:hover,.tw-top::-webkit-scrollbar-thumb:hover,.tw::-webkit-scrollbar-thumb:active,.tw-top::-webkit-scrollbar-thumb:active{background:var(--accent);background-clip:content-box}
@supports not selector(::-webkit-scrollbar){.tw,.tw-top{scrollbar-width:thin;scrollbar-color:var(--muted) transparent}}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font:700 17px var(--font-display);margin-bottom:4px}
.hist{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .m{min-width:0;display:flex;flex-direction:column}
.hist .m small{color:var(--muted)}
textarea.in{width:100%;min-height:120px;resize:vertical}
.hint{color:var(--muted);font-size:12px;margin:0}
table.sc{min-width:520px}
table.sc th,table.sc td{padding:7px 10px;white-space:nowrap}
table.sc .stk{position:sticky;left:0;z-index:1;background:var(--surface);white-space:normal;min-width:150px;max-width:210px;border-right:1px solid var(--line)}
table.sc th.stk{background:var(--surface2);text-align:left}
table.sc thead tr:first-child th{text-align:left;border-bottom:1px solid var(--line)}
table.sc thead tr:first-child th.n,table.sc thead tr:first-child th.stk{text-align:left;vertical-align:bottom}
table.sc td.calc{background:var(--surface2)}
table.sc td.low{background:var(--red-bg);color:var(--red)}
input.hd{width:104px;padding:4px 6px;font-size:12px;font-weight:600}
table.sc tfoot td{font-weight:700;background:var(--surface2)}
table.sc tfoot td.stk{background:var(--surface2)}
input.sk{width:76px;text-align:right;font-variant-numeric:tabular-nums;padding:6px 8px}
.low{background:var(--red-bg);color:var(--red);font-weight:700}
.ph{display:flex;flex-direction:column;gap:2px;min-width:84px}
.ph small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ph button{align-self:flex-start;background:none;border:0;padding:0;color:var(--red);font-size:12px;cursor:pointer;text-decoration:underline;text-transform:none;letter-spacing:0}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tg{transition:border-color .12s,background .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Catatan Kelas</h1>
      <p class="sub" id="subjudul">Terlambat, tidak lengkap, zona berubah warna, dan nilai</p>
    </div>
    <span id="stat" role="status" aria-live="polite"></span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Menu">
    <button role="tab" data-tab="catat" aria-selected="true">Catat</button>
    <button role="tab" data-tab="nilai" aria-selected="false">Nilai</button>
    <button role="tab" data-tab="rekap" aria-selected="false">Rekap Catatan</button>
    <button role="tab" data-tab="rnilai" aria-selected="false">Rekap Nilai</button>
    <button role="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
    <button role="tab" data-tab="siswa" aria-selected="false">Siswa</button>
    <button role="tab" data-tab="atur" aria-selected="false">Pengaturan</button>
  </nav>
  <div id="banner"></div>
  <main id="view"><div class="card empty">Memuat data kelas…</div></main>
</div>

<script>
(function(){
"use strict";
var JENIS={terlambat:"Terlambat",tidak_lengkap:"Tidak lengkap",zona:"Zona berubah warna"};
var LS="catatan-kelas-v1";
var S={siswa:[],catatan:[],ambang:5,mapel:[],kkm:75,ket:{},profil:{sekolah:"",kelas:"",tahun:"",wali:""}};
var ref=null, loaded=false;
var dl={save:async function(o){
  var blob=(typeof Blob!=="undefined"&&o.data instanceof Blob)?o.data:new Blob([o.data],{type:/\.csv$/i.test(o.filename)?"text/csv;charset=utf-8":"application/json;charset=utf-8"});
  var a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=o.filename;a.style.display="none";document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},4000);
  return {status:"saved"};
}};
var tab="catat", openSid=null, q="", confirmKey=null, selMapel=null;

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
var TODAY=iso(new Date());
var R={tgl:TODAY,dari:TODAY.slice(0,8)+"01",sampai:TODAY};
function fmt(s){try{return new Date(s+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return s}}
function fmtS(s){try{return new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s}}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){try{return crypto.randomUUID().slice(0,8)}catch(e){return Math.random().toString(36).slice(2,10)}}
function byName(a,b){return a.nama.localeCompare(b.nama,"id")}
function sName(id){var s=S.siswa.find(function(x){return x.id===id});return s?s.nama:"(siswa dihapus)"}
var $=function(id){return document.getElementById(id)};
var view=$("view");
view.addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key!=="Enter"||e.isComposing||!t||!t.matches||!t.matches("input[data-skor]"))return;
  e.preventDefault();
  var cid=t.getAttribute("data-skor"),sid=t.getAttribute("data-sid");
  var all=[].slice.call(view.querySelectorAll("input[data-skor]")).filter(function(x){return x.getAttribute("data-skor")===cid});
  var i=all.indexOf(t),dir=e.shiftKey?-1:1,nx=all[i+dir];
  var nsid=nx?nx.getAttribute("data-sid"):null;
  t.blur();
  if(!nsid)return;
  setTimeout(function(){
    var el=[].slice.call(view.querySelectorAll("input[data-skor]")).filter(function(x){return x.getAttribute("data-skor")===cid&&x.getAttribute("data-sid")===nsid})[0];
    if(el){el.focus();el.select&&el.select();try{el.scrollIntoView({block:"nearest",inline:"nearest"})}catch(_){}}
  },0);
});

/* ---------- penyimpanan ---------- */
function normalize(d){
  d=d||{};
  var isObj=function(o){return o&&typeof o==="object"&&!Array.isArray(o)};
  var ms=(Array.isArray(d.mapel)?d.mapel:[]).filter(function(m){return m&&m.id}).map(function(m){
    var o={id:m.id,nama:m.nama||"Mata pelajaran",cols:Array.isArray(m.cols)?m.cols.filter(function(c){return c&&c.id&&(c.g==="h"||c.g==="u")}):[],skor:isObj(m.skor)?m.skor:{}};
    if(isObj(m.bobot))o.bobot=m.bobot;
    return o;
  });
  return {siswa:Array.isArray(d.siswa)?d.siswa:[],catatan:Array.isArray(d.catatan)?d.catatan:[],ambang:typeof d.ambang==="number"&&isFinite(d.ambang)?d.ambang:5,
    mapel:ms,kkm:typeof d.kkm==="number"&&isFinite(d.kkm)?d.kkm:75,ket:isObj(d.ket)?d.ket:{},
    profil:(function(p){p=isObj(p)?p:{};return {sekolah:String(p.sekolah||""),kelas:String(p.kelas||""),tahun:String(p.tahun||""),wali:String(p.wali||"")}})(d.profil)};
}
function setStatus(m){var e=$("stat");if(e)e.textContent=m}
var timer=null,saving=false,dirty=false;
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(flush,350);setStatus("Menyimpan…")}
async function flush(){
  if(saving){timer=setTimeout(flush,200);return}
  if(!dirty)return;
  dirty=false;saving=true;
  try{localStorage.setItem(LS,JSON.stringify(S));afterLocalSave()}
  catch(e){setStatus("Tidak bisa menyimpan di browser ini. Unduh cadangan di tab Pengaturan.")}
  finally{saving=false}
}
function commit(){save()}
function flushSync(){if(!dirty)return;dirty=false;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(sync.cfg){sync.pending=true;saveSync()}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushSync()});
window.addEventListener("pagehide",flushSync);

function initData(){
  try{var raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw))}catch(e){}
  loaded=true;render();startSync();
}

/* ---------- simpan online (GitHub) ---------- */
var SYNC_KEY="catatan-kelas-sync",SYNC_FILE="catatan-kelas.json";
var sync={cfg:null,sha:"",pending:false,last:"",conflict:null,choice:null,msg:"",connecting:false,ver:0,draft:{repo:"",token:""}};
var pushTimer=0,retryTimer=0,lastPull=0,chain=Promise.resolve();
function loadSync(){
  try{
    var o=JSON.parse(localStorage.getItem(SYNC_KEY)||"null");
    if(o&&o.token&&o.repo){sync.cfg={repo:o.repo,token:o.token};sync.sha=o.sha||"";sync.pending=!!o.pending;sync.last=o.last||""}
  }catch(e){}
}
function saveSync(){
  try{
    if(sync.cfg)localStorage.setItem(SYNC_KEY,JSON.stringify({repo:sync.cfg.repo,token:sync.cfg.token,sha:sync.sha,pending:sync.pending,last:sync.last}));
    else localStorage.removeItem(SYNC_KEY);
  }catch(e){}
}
function exclusive(fn){var p=chain.then(function(){return fn()}).catch(syncError);chain=p;return p}
function hhmm(d){try{return new Date(d||Date.now()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function apiBase(repo){return "https://api.github.com/repos/"+repo}
function hdr(token,extra){
  var h={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(extra)Object.keys(extra).forEach(function(k){h[k]=extra[k]});
  return h;
}
function b64enc(str){
  var bytes=new TextEncoder().encode(str),bin="";
  for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin);
}
function b64dec(b){
  var bin=atob(String(b).replace(/\s/g,"")),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pack(){return JSON.stringify({app:"catatan-kelas",versi:1,disimpan:new Date().toISOString(),data:S})}
function unpack(text){var o=JSON.parse(text);return normalize(o&&o.data?o.data:o)}
function describe(text){try{var d=unpack(text);return d.siswa.length+" siswa, "+d.mapel.length+" mata pelajaran, "+d.catatan.length+" catatan"}catch(e){return "isi tidak dikenali"}}
function sameData(text){try{return JSON.stringify(unpack(text))===JSON.stringify(normalize(S))}catch(e){return false}}
async function getFile(repo,token){
  var url=apiBase(repo)+"/contents/"+SYNC_FILE;
  var res=await fetch(url,{headers:hdr(token),cache:"no-store"});
  if(res.status!==200)return {status:res.status};
  var j=await res.json(),text;
  if(j.content&&j.encoding==="base64")text=b64dec(j.content);
  else{
    var r2=await fetch(url,{headers:hdr(token,{"Accept":"application/vnd.github.raw+json"}),cache:"no-store"});
    if(r2.status!==200)return {status:r2.status};
    text=await r2.text();
  }
  return {status:200,sha:j.sha,text:text};
}
function syncMsg(t){sync.msg=t;setStatus(t)}
function syncError(e){
  var c=e&&e.code;
  if(c===401||c===403)syncMsg("Token ditolak atau sudah kedaluwarsa. Buat token baru lalu hubungkan ulang di Pengaturan.");
  else if(c)syncMsg("Gagal menyimpan online (kode "+c+"). Data aman di browser ini.");
  else syncMsg("Belum bisa terhubung ke GitHub. Data aman di browser ini dan akan dikirim ulang.");
  clearTimeout(retryTimer);
  if(sync.cfg&&sync.pending&&!sync.conflict&&c!==401&&c!==403)retryTimer=setTimeout(function(){if(sync.cfg&&sync.pending&&!sync.conflict)exclusive(pushImpl)},60000);
}
function markDirtyRemote(){
  if(!sync.cfg)return;
  sync.pending=true;sync.ver++;saveSync();
  if(!sync.conflict){
    setStatus("Menyimpan online…");
    clearTimeout(pushTimer);
    pushTimer=setTimeout(function(){exclusive(pushImpl)},3000);
  }
}
function afterLocalSave(){if(sync.cfg)markDirtyRemote();else setStatus("Tersimpan di browser ini")}
function applyRemoteText(text,sha){
  S=unpack(text);sync.sha=sha;sync.pending=false;sync.conflict=null;sync.last=new Date().toISOString();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  saveSync();selMapel=null;openSid=null;pendingRestore=null;imp=null;
  setStatus("Data online dimuat "+hhmm());
  render();renderBanner();
}
async function pushImpl(){
  if(!sync.cfg||sync.conflict)return;
  var v0=sync.ver,content=b64enc(pack());
  var body={message:"Simpan data "+new Date().toISOString().slice(0,16).replace("T"," "),content:content};
  if(sync.sha)body.sha=sync.sha;
  var res=await fetch(apiBase(sync.cfg.repo)+"/contents/"+SYNC_FILE,{method:"PUT",headers:hdr(sync.cfg.token,{"Content-Type":"application/json"}),body:JSON.stringify(body),cache:"no-store"});
  if(res.status===200||res.status===201){
    var j=await res.json();
    sync.sha=(j.content&&j.content.sha)||sync.sha;sync.last=new Date().toISOString();clearTimeout(retryTimer);
    if(sync.ver===v0){sync.pending=false;setStatus("Tersimpan online "+hhmm())}
    else{setStatus("Menyimpan online…");clearTimeout(pushTimer);pushTimer=setTimeout(function(){exclusive(pushImpl)},3000)}
    saveSync();updateSyncLast();
    return;
  }
  if(res.status===409||res.status===422){
    var r=await getFile(sync.cfg.repo,sync.cfg.token);
    if(r.status===404){sync.sha="";saveSync();return pushImpl()}
    if(r.status!==200)throw {code:r.status};
    if(sameData(r.text)){sync.sha=r.sha;sync.pending=false;sync.last=new Date().toISOString();saveSync();setStatus("Tersimpan online "+hhmm());updateSyncLast();return}
    sync.conflict={sha:r.sha,text:r.text};
    setStatus("Data online berbeda dengan data di perangkat ini");
    renderBanner();if(tab==="atur")renderAtur();
    return;
  }
  throw {code:res.status};
}
async function pullImpl(){
  if(!sync.cfg||sync.conflict)return;
  lastPull=Date.now();
  var r=await getFile(sync.cfg.repo,sync.cfg.token);
  if(r.status===404){
    var rr=await fetch(apiBase(sync.cfg.repo),{headers:hdr(sync.cfg.token),cache:"no-store"});
    if(rr.status===200){sync.sha="";sync.pending=true;saveSync();return pushImpl()}
    throw {code:rr.status};
  }
  if(r.status!==200)throw {code:r.status};
  if(r.sha===sync.sha){
    if(sync.pending)return pushImpl();
    sync.last=new Date().toISOString();saveSync();setStatus("Tersimpan online "+hhmm());updateSyncLast();return;
  }
  if(!sync.pending){applyRemoteText(r.text,r.sha);return}
  if(sameData(r.text)){sync.sha=r.sha;sync.pending=false;saveSync();setStatus("Tersimpan online "+hhmm());return}
  sync.conflict={sha:r.sha,text:r.text};
  setStatus("Data online berbeda dengan data di perangkat ini");
  renderBanner();if(tab==="atur")renderAtur();
}
function updateSyncLast(){var e=$("sync-last");if(e)e.textContent=sync.last?hhmm(sync.last):"belum pernah"}
function renderBanner(){
  var b=$("banner");if(!b)return;
  if(!sync.conflict){b.innerHTML="";return}
  b.innerHTML='<div class="card pad" role="alert" style="margin-bottom:16px;border-color:var(--red);display:flex;flex-direction:column;gap:10px">'+
    '<strong>Data online berbeda dengan data di perangkat ini</strong>'+

    '<div class="row"><button class="btn pri" data-sync="useremote">Pakai data online</button><button class="btn warn" data-sync="overwrite">Timpa data online dengan data perangkat ini</button></div>'+
    '<p class="hint">Perubahan yang belum terkirim dari perangkat ini hilang jika Anda memilih data online. Unduh cadangan di Pengaturan lebih dulu jika ragu.</p></div>';
}
async function doConnect(repoIn,token){
  var repo=String(repoIn||"").trim().replace(/^https?:\/\/github\.com\//i,"").replace(/\.git$/i,"").replace(/^\/+|\/+$/g,"");
  token=String(token||"").trim();
  sync.draft={repo:repo,token:token};
  var fail=function(m){sync.connecting=false;sync.msg=m;renderAtur()};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return fail("Isi nama repository dengan format akun/nama-repository.");
  if(!token)return fail("Tempel token GitHub terlebih dahulu.");
  sync.connecting=true;sync.msg="Menghubungkan…";renderAtur();
  try{
    var rr=await fetch(apiBase(repo),{headers:hdr(token),cache:"no-store"});
    if(rr.status===401)return fail("Token ditolak. Periksa token yang ditempel.");
    if(rr.status===404||rr.status===403)return fail("Repository tidak ditemukan, atau token belum diberi akses ke repository itu.");
    if(rr.status!==200)return fail("GitHub membalas dengan kode "+rr.status+".");
    var info=await rr.json();
    if(info.private!==true)return fail("Repository ini publik, sehingga nama dan nilai siswa bisa dilihat siapa pun. Ubah menjadi Private di GitHub, lalu coba lagi.");
    if(info.permissions&&info.permissions.push===false)return fail("Token hanya bisa membaca. Beri izin Contents: Read and write.");
    var f=await getFile(repo,token);
    sync.connecting=false;
    if(f.status===404){
      sync.cfg={repo:repo,token:token};sync.sha="";sync.pending=true;sync.msg="";saveSync();
      await exclusive(pushImpl);renderAtur();return;
    }
    if(f.status!==200)return fail("Gagal membaca data online (kode "+f.status+"). Pastikan token punya izin Contents.");
    if(!(S.siswa.length||S.mapel.length||S.catatan.length)){
      sync.cfg={repo:repo,token:token};sync.msg="";applyRemoteText(f.text,f.sha);renderAtur();return;
    }
    sync.msg="";sync.choice={repo:repo,token:token,sha:f.sha,text:f.text};renderAtur();
  }catch(e){fail("Tidak bisa terhubung ke GitHub. Periksa koneksi internet.")}
}

    '<div class="fld"><label class="lbl" for="sync-token">Token GitHub</label><input class="in" id="sync-token" type="password" value="'+esc2(sync.draft.token)+'" placeholder="github_pat_…" autocomplete="off"></div></div>'+

function onSyncClick(e){
  var b=e.target.closest("[data-sync]");if(!b)return;
  var a=b.dataset.sync;
  if(a==="connect"){doConnect(($("sync-repo")||{}).value,($("sync-token")||{}).value)}
  else if(a==="now"){
    if(sync.conflict)return;
    setStatus("Menyinkronkan…");
    exclusive(function(){return sync.pending?pushImpl():pullImpl()});
  }
  else if(a==="off"){
    clearTimeout(pushTimer);clearTimeout(retryTimer);
    sync.cfg=null;sync.sha="";sync.pending=false;sync.conflict=null;sync.msg="";sync.draft={repo:"",token:""};saveSync();
    setStatus("Koneksi online diputus. Data tetap tersimpan di browser ini.");renderBanner();if(tab==="atur")renderAtur();
  }
  else if(a==="chooseremote"&&sync.choice){var c=sync.choice;sync.choice=null;sync.cfg={repo:c.repo,token:c.token};applyRemoteText(c.text,c.sha);renderAtur()}
  else if(a==="chooselocal"&&sync.choice){var c2=sync.choice;sync.choice=null;sync.cfg={repo:c2.repo,token:c2.token};sync.sha=c2.sha;sync.pending=true;sync.msg="";saveSync();exclusive(pushImpl);renderAtur()}
  else if(a==="choosecancel"){sync.choice=null;renderAtur()}
  else if(a==="useremote"&&sync.conflict){applyRemoteText(sync.conflict.text,sync.conflict.sha);if(tab==="atur")renderAtur()}
  else if(a==="overwrite"&&sync.conflict){sync.sha=sync.conflict.sha;sync.conflict=null;sync.pending=true;saveSync();renderBanner();setStatus("Menyimpan online…");exclusive(pushImpl);if(tab==="atur")renderAtur()}
}
function startSync(){
  loadSync();
  var bn=$("banner");if(bn)bn.addEventListener("click",onSyncClick);
  view.addEventListener("click",onSyncClick);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&sync.cfg&&!sync.pending&&!sync.conflict&&Date.now()-lastPull>15000)exclusive(pullImpl);
  });
  window.addEventListener("online",function(){if(sync.cfg&&!sync.conflict)exclusive(sync.pending?pushImpl:pullImpl)});
  if(sync.cfg){setStatus("Memeriksa data online…");exclusive(pullImpl)}else setStatus("");
}

/* ---------- logika catatan ---------- */
function find(sid,tgl,j){return S.catatan.find(function(c){return c.sid===sid&&c.tgl===tgl&&c.jenis===j})}
function remove(c){S.catatan=S.catatan.filter(function(x){return x!==c})}
function toggle(sid,j){
  var c=find(sid,R.tgl,j);
  if(c)remove(c);else S.catatan.push({id:uid(),tgl:R.tgl,sid:sid,jenis:j,ket:""});
  commit();
}
function step(sid,d){
  var c=find(sid,R.tgl,"zona");
  var n=Math.max(0,Math.min(99,(c?c.jumlah||0:0)+d));
  if(!c&&n>0)S.catatan.push({id:uid(),tgl:R.tgl,sid:sid,jenis:"zona",jumlah:n,ket:""});
  else if(c){if(n===0)remove(c);else c.jumlah=n}
  commit();
}
function suggest(j){
  var cnt={};
  S.catatan.forEach(function(c){if(c.jenis===j&&c.ket){cnt[c.ket]=(cnt[c.ket]||0)+1}});
  return Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,6);
}
function inRange(t){return t>=R.dari&&t<=R.sampai}
function rekap(){
  return S.siswa.slice().sort(byName).map(function(s){
    var cs=S.catatan.filter(function(c){return c.sid===s.id&&inRange(c.tgl)});
    var z=cs.filter(function(c){return c.jenis==="zona"});
    return {nama:s.nama,
      terlambat:cs.filter(function(c){return c.jenis==="terlambat"}).length,
      lengkap:cs.filter(function(c){return c.jenis==="tidak_lengkap"}).length,
      zona:z.reduce(function(a,c){return a+(c.jumlah||0)},0),
      hari:z.filter(function(c){return (c.jumlah||0)>S.ambang}).length};
  });
}

function applyTema(v){

function readBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result||""));
      var d=normalize(o&&o.data?o.data:o);
      if(!d.siswa.length&&!d.mapel.length&&!d.catatan.length){setStatus("Berkas ini tidak berisi data kelas");pendingRestore=null}
      else{pendingRestore=d;setStatus("Berkas dibaca, pilih Ganti data sekarang")}
    }catch(e){pendingRestore=null;setStatus("Berkas tidak bisa dibaca, pastikan berkas cadangan .json dari aplikasi ini")}
    if(tab==="atur")renderAtur();
  };
  fr.onerror=function(){setStatus("Berkas tidak bisa dibaca")};
  fr.readAsText(file);
}

/* ---------- nilai ---------- */
function isNum(v){return typeof v==="number"&&isFinite(v)}
function meanOf(arr){var vs=arr.filter(isNum);return vs.length?vs.reduce(function(a,b){return a+b},0)/vs.length:null}
function mById(id){return S.mapel.find(function(m){return m.id===id})}
function sc(m,sid,cid){var d=m.skor&&m.skor[sid];return d?d[cid]:undefined}
function grp(m,g){return m.cols.filter(function(c){return c.g===g})}
function rataG(m,sid,g){return meanOf(grp(m,g).map(function(c){return sc(m,sid,c.id)}))}
function numOr(v){return isNum(v)?v:null}
function comps(m,sid){return {h:rataG(m,sid,"h"),uts:numOr(sc(m,sid,"uts")),u:rataG(m,sid,"u"),sas:numOr(sc(m,sid,"sas"))}}
function akhir(m,sid){
  var cp=comps(m,sid),w=m.bobot||{},keys=Object.keys(cp);
  var useW=keys.some(function(k){return w[k]>0});
  var num=0,den=0;
  keys.forEach(function(k){
    if(cp[k]===null)return;
    var wt=useW?(w[k]>0?w[k]:0):1;
    num+=cp[k]*wt;den+=wt;
  });
  return den>0?num/den:null;
}
function avgAll(sid){return meanOf(S.mapel.map(function(m){return akhir(m,sid)}))}
function f1(v){return v===null||v===undefined?"–":(Math.round(v*10)/10).toLocaleString("id-ID",{maximumFractionDigits:1})}
function r2(v){return v===null||v===undefined?"":Math.round(v*100)/100}
function sisSorted(){return S.siswa.slice().sort(byName)}
function curMapel(){
  if(!S.mapel.some(function(m){return m.id===selMapel}))selMapel=S.mapel.length?S.mapel[0].id:null;
  return selMapel;
}
function colAvg(m,cid){return meanOf(S.siswa.map(function(s){return numOr(sc(m,s.id,cid))}))}
function lowCls(v){return v!==null&&v<S.kkm?" low":""}

function rankMap(){
  var list=S.siswa.map(function(s){return {id:s.id,a:avgAll(s.id)}});
  var mp={};
  list.forEach(function(x){if(x.a===null)return;mp[x.id]=1+list.filter(function(y){return y.a!==null&&y.a>x.a}).length});
  return mp;
}

function mapelHeader(m){
  var h=["No","Nama"];
  grp(m,"h").forEach(function(c){h.push(safe(c.nama))});
  h.push("Rata-rata Harian","UTS");
  grp(m,"u").forEach(function(c){h.push(safe(c.nama))});
  h.push("Rata-rata Ulangan","SAS","Nilai Akhir");
  return h;
}
function raw(v){return v===undefined?"":v}
function mapelRows(m){
  var rows=[mapelHeader(m)];
  sisSorted().forEach(function(s,i){
    var r=[i+1,safe(s.nama)];
    grp(m,"h").forEach(function(c){r.push(raw(sc(m,s.id,c.id)))});
    r.push(r2(rataG(m,s.id,"h")),raw(sc(m,s.id,"uts")));
    grp(m,"u").forEach(function(c){r.push(raw(sc(m,s.id,c.id)))});
    r.push(r2(rataG(m,s.id,"u")),raw(sc(m,s.id,"sas")),r2(akhir(m,s.id)));
    rows.push(r);
  });
  var f=["","Rata-rata kelas"];
  grp(m,"h").forEach(function(c){f.push(r2(colAvg(m,c.id)))});
  f.push(r2(meanOf(S.siswa.map(function(s){return rataG(m,s.id,"h")}))),r2(colAvg(m,"uts")));
  grp(m,"u").forEach(function(c){f.push(r2(colAvg(m,c.id)))});
  f.push(r2(meanOf(S.siswa.map(function(s){return rataG(m,s.id,"u")}))),r2(colAvg(m,"sas")),r2(meanOf(S.siswa.map(function(s){return akhir(m,s.id)}))));
  rows.push(f);
  return rows;
}
function rekapNilaiRows(){
  var rk=rankMap(),ket=S.ket||{};
  var rows=[["No","Nama"].concat(S.mapel.map(function(m){return safe(m.nama)}),["Rata-rata","Peringkat","Keterangan"])];
  sisSorted().forEach(function(s,i){
    rows.push([i+1,safe(s.nama)].concat(S.mapel.map(function(m){return r2(akhir(m,s.id))}),[r2(avgAll(s.id)),rk[s.id]||"",safe(ket[s.id]||"")]));
  });
  var cols=S.mapel.map(function(m){return S.siswa.map(function(s){return akhir(m,s.id)})});
  var allA=S.siswa.map(function(s){return avgAll(s.id)});
  var vals=function(a){return a.filter(isNum)};
  var add=function(label,fn){rows.push(["",label].concat(cols.map(function(c){return r2(fn(c))}),[r2(fn(allA)),"",""]))};
  rows.push([]);
  rows.push(["","KKM",S.kkm]);
  add("Rata-rata kelas",meanOf);
  add("Nilai terkecil",function(a){var v=vals(a);return v.length?Math.min.apply(null,v):null});
  add("Nilai tertinggi",function(a){var v=vals(a);return v.length?Math.max.apply(null,v):null});
  return rows;
}

var imp=null,notice="";
function noticeHtml(){return notice?'<div class="card pad" role="status" style="margin-bottom:16px;border-color:var(--accent)">'+esc(notice)+'</div>':""}
function notify(msg){notice=msg;setStatus(msg);if(tab==="nilai")renderNilai();else if(tab==="siswa")renderSiswa()}
function nk(s){return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"")}
function nname(s){return String(s==null?"":s).replace(/\s+/g," ").trim().toLowerCase()}
function canon(n){
  var s=nname(n);
  if(/^b\.?\s*indo(nesia)?$/.test(s))return "bahasa indonesia";
  return s;
}
function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  var first=text.split(/\r?\n/).slice(0,6).join("\n"),best=",",bc=-1;
  [",",";","\t"].forEach(function(s){var c=first.split(s).length-1;if(c>bc){bc=c;best=s}});
  var rows=[],row=[],f="",q=false,i=0,n=text.length;
  for(;i<n;i++){
    var ch=text.charAt(i);
    if(q){if(ch==='"'){if(text.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===best){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text.charAt(i+1)==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function cellVal(v){
  if(v===null||v===undefined)return undefined;
  if(typeof v==="number")return isFinite(v)?Math.max(0,Math.min(100,v)):undefined;
  var s=String(v).trim();
  if(!s)return undefined;
  if(/^[sia]$/i.test(s))return s.toUpperCase();
  if(!/^[\d.,+\-]+$/.test(s))return undefined;
  var x=Number(s.replace(",","."));
  return isFinite(x)?Math.max(0,Math.min(100,x)):undefined;
}
var SKIPK={no:1,nomor:1,nisn:1,nis:1,ket:1,keterangan:1,peringkat:1,rangking:1,ranking:1,jumlah:1,total:1,kkm:1};
function findHeader(aoa){
  for(var r=0;r<Math.min(aoa.length,20);r++){
    var row=aoa[r]||[];
    for(var c=0;c<Math.min(row.length,5);c++){
      var k=nk(row[c]);
      if(k==="nama"||k==="namasiswa"||k==="namalengkap")return {r:r,c:c};
    }
  }
  return null;
}
function studentRows(aoa,hr,nc){
  var rows=[];
  for(var r=hr+1;r<aoa.length;r++){
    var rw=aoa[r]||[],nm=String(rw[nc]==null?"":rw[nc]).replace(/\s+/g," ").trim();
    if(!nm)continue;
    if(/^(rata|jumlah|total|kkm|nilai\s*(terkecil|tertinggi))/i.test(nm))continue;
    if(/^[\d.,]+$/.test(nm))continue;
    rows.push({r:r,nama:nm});
  }
  return rows;
}
function parseGradeSheet(aoa,name){
  var h=findHeader(aoa);if(!h)return null;
  var head=aoa[h.r]||[],nc=h.c;
  if(head.some(function(x){return nk(x)==="peringkat"}))return null;
  var rows=studentRows(aoa,h.r,nc);if(!rows.length)return null;
  var maxc=0;
  for(var i=h.r;i<Math.min(aoa.length,h.r+80);i++)maxc=Math.max(maxc,(aoa[i]||[]).length);
  maxc=Math.min(maxc,90);
  var cols=[],seenUts=false,seenSas=false,nH=0,nU=0;
  for(var c=nc+1;c<maxc;c++){
    var hv=head[c],hs=hv==null?"":String(hv).replace(/\s+/g," ").trim(),hk=nk(hs);
    var hasData=rows.some(function(x){var v=(aoa[x.r]||[])[c];return v!==null&&v!==undefined&&String(v).trim()!==""});
    if(hk==="asli"||hk==="nilaiakhir"||hk==="akhir"||hk==="nilaiasli")break;
    if(hk.indexOf("rata")===0||SKIPK[hk])continue;
    if(hk==="uts"||hk==="pts"||hk==="penilaiantengahsemester"){if(!seenUts){cols.push({g:"uts",c:c,nama:"UTS"});seenUts=true}continue}
    if(hk==="sas"||hk==="pas"||hk==="uas"||hk==="psas"||hk==="penilaianakhirsemester"){if(!seenSas){cols.push({g:"sas",c:c,nama:"SAS"});seenSas=true}continue}
    if(!hs&&!hasData)continue;
    var g=/^(ulangan|latihanakhir|ul\d)/.test(hk)?"u":(seenUts?"u":"h");
    cols.push({g:g,c:c,nama:hs||((g==="h"?"Harian ":"Ulangan ")+(g==="h"?++nH:++nU))});
  }
  var out=cols.map(function(x,i){return {g:x.g,nama:x.nama,c:x.c,key:(x.g==="uts"||x.g==="sas")?x.g:"k"+i}});
  var nScore=0;
  var data=rows.map(function(x){
    var o={};
    out.forEach(function(cl){var v=cellVal((aoa[x.r]||[])[cl.c]);if(v!==undefined){o[cl.key]=v;nScore++}});
    return {nama:x.nama,vals:o};
  });
  var struct=out.some(function(x){return x.g==="uts"||x.g==="sas"||x.g==="u"});
  return {name:String(name||"").trim(),cols:out,rows:data,nScore:nScore,struct:struct};
}
function defaultMapelName(n){
  var nm=String(n||"").replace(/\s+/g," ").trim();
  var ex=S.mapel.find(function(m){return canon(m.nama)===canon(nm)});
  return ex?ex.nama:nm;
}
function readAny(file,cb){
  var isCsv=/\.(csv|tsv|txt)$/i.test(file.name);
  var fr=new FileReader();
  fr.onerror=function(){notify("Berkas tidak bisa dibaca")};
  fr.onload=function(){
    try{
      var sheets=[];
      if(isCsv){
        sheets.push({name:file.name.replace(/\.[^.]+$/,""),aoa:parseCSV(new TextDecoder("utf-8").decode(new Uint8Array(fr.result)))});
      }else{
        if(!window.XLSX){notify("Pustaka Excel belum termuat. Sambungkan internet lalu muat ulang halaman, atau simpan berkas sebagai .csv");return}
        var wb=XLSX.read(new Uint8Array(fr.result),{type:"array"});
        var hid={};((wb.Workbook&&wb.Workbook.Sheets)||[]).forEach(function(s){if(s&&s.Hidden)hid[s.name]=1});
        wb.SheetNames.forEach(function(n){
          if(hid[n])return;
          sheets.push({name:n,aoa:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true})});
        });
      }
      cb(sheets);
    }catch(e){notify("Berkas tidak bisa dibaca. Pastikan formatnya .xlsx atau .csv")}
  };
  fr.readAsArrayBuffer(file);
}
function readImport(file){

    });
    if(!items.length){imp=null;notify("Tidak ada lembar nilai yang dikenali. Lembar harus punya kolom Nama dan kolom nilai.");return}

  });
}

function applyImport(){
  if(!imp)return;
  var map={};S.siswa.forEach(function(s){map[nname(s.nama)]=s.id});
  var newS=0,mCount=0,cells=0,skip={},last=null;
  imp.items.forEach(function(it){
    if(!it.sel)return;
    var nm=it.name.replace(/\s+/g," ").trim()||it.parsed.name||"Mata pelajaran";
    var m=S.mapel.find(function(x){return canon(x.nama)===canon(nm)});
    var cmap={},fresh=!m||imp.mode==="replace";
    if(!m){m={id:uid(),nama:nm,cols:[],skor:{}};S.mapel.push(m)}
    if(fresh){m.cols=[];m.skor={}}
    var hi=0,ui=0,used={};
    it.parsed.cols.forEach(function(cl){
      if(cl.g==="uts"||cl.g==="sas"){cmap[cl.key]=cl.g;return}
      var ex=!fresh&&m.cols.find(function(c){return c.g===cl.g&&nk(c.nama)===nk(cl.nama)&&!used[c.id]});
      if(ex){cmap[cl.key]=ex.id;used[ex.id]=1;return}
      var id=fresh?((cl.g==="h"?"h":"u")+(cl.g==="h"?++hi:++ui)):("x"+uid());
      m.cols.push({id:id,g:cl.g,nama:cl.nama});cmap[cl.key]=id;used[id]=1;
    });
    it.parsed.rows.forEach(function(r){
      var key=nname(r.nama),sid=map[key];
      if(!sid){
        if(!imp.addNew){skip[key]=1;return}
        sid=uid();S.siswa.push({id:sid,nama:r.nama});map[key]=sid;newS++;
      }
      var d=m.skor[sid]||{},any=false;
      Object.keys(r.vals).forEach(function(k){d[cmap[k]]=r.vals[k];cells++;any=true});
      if(any)m.skor[sid]=d;
    });
    mCount++;last=m.id;
  });
  if(last)selMapel=last;
  var ns=Object.keys(skip).length;
  imp=null;commit();
  notice="Impor selesai: "+mCount+" mata pelajaran, "+cells+" isian nilai"+(newS?", "+newS+" siswa baru":"")+(ns?", "+ns+" nama dilewati":"")+".";
  renderNilai();
}

async function unduh(kind){

  var sepEl=$("sep"),sep=sepEl?sepEl.value:",";
  var span=R.dari+"_sd_"+R.sampai,name,data;

      var nb=XLSX.utils.book_new(),usedNm={};

      };

      }

    }

    else if(kind==="m-csv"){var cm2=mById(curMapel());if(!cm2)return;data=toCSV(mapelRows(cm2),sep);name="nilai-"+cm2.nama.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"_"+TODAY+".csv"}

    await dl.save({filename:name,data:data});

      var nm={id:uid(),nama:mn,cols:cols,skor:{}};S.mapel.push(nm);selMapel=nm.id;commit();
    }
    renderNilai();
  }
  else if(act==="delmapel"){
    var dm=curMapel();
    if(confirmKey==="m:"+dm){
      S.mapel=S.mapel.filter(function(m){return m.id!==dm});
      selMapel=null;confirmKey=null;commit();
    }else confirmKey="m:"+dm;
    renderNilai();
  }
  else if(act==="addcol"){
    var am=mById(curMapel());if(!am)return;
    var g=b.dataset.g,cn=$("colbaru").value.replace(/\s+/g," ").trim();
    if(!cn)cn=(g==="h"?"Harian ":"Ulangan ")+(grp(am,g).length+1);
    am.cols.push({id:"x"+uid(),g:g,nama:cn});
    commit();renderNilai();
  }
  else if(act==="delcol"){
    var dmm=mById(curMapel()),dcid=b.dataset.cid;if(!dmm)return;
    var ck="c:"+dmm.id+":"+dcid;
    if(confirmKey===ck){
      dmm.cols=dmm.cols.filter(function(c){return c.id!==dcid});
      Object.keys(dmm.skor).forEach(function(k){if(dmm.skor[k])delete dmm.skor[k][dcid]});
      confirmKey=null;commit();
    }else confirmKey=ck;
    renderNilai();
  }
  else if(act==="hari-"||act==="hari+"||act==="hariini"){
    R.tgl=act==="hariini"?TODAY:addDays(R.tgl,act==="hari-"?-1:1);
    $("tgl").value=R.tgl;renderSum();renderList();
  }
  else if(act==="buka"){openSid=openSid===sid?null:sid;renderList()}
  else if(act==="tg"){toggle(sid,b.dataset.j);renderList();renderSum();
    var inp=view.querySelector('[data-ket="'+b.dataset.j+'"]');if(inp)inp.focus()}
  else if(act==="zm"||act==="zp"){step(sid,act==="zp"?1:-1);renderList();renderSum()}
  else if(act==="chip"){var c=find(sid,R.tgl,b.dataset.j);if(c){c.ket=b.dataset.v;commit();renderList()}}
  else if(act==="delc"){
    var cid=b.closest("[data-cid]").dataset.cid;
    if(confirmKey===cid){S.catatan=S.catatan.filter(function(x){return x.id!==cid});confirmKey=null;commit()}
    else confirmKey=cid;
    renderRiwayat();
  }
  else if(act==="dels"){
    if(confirmKey===sid){S.siswa=S.siswa.filter(function(x){return x.id!==sid});S.catatan=S.catatan.filter(function(x){return x.sid!==sid});S.mapel.forEach(function(m){if(m.skor)delete m.skor[sid]});if(S.ket)delete S.ket[sid];confirmKey=null;commit()}
    else confirmKey=sid;
    renderSiswa();
  }
  else if(act==="tambah"){
    var have={};S.siswa.forEach(function(s){have[s.nama.toLowerCase()]=1});
    var added=0;
    $("paste").value.split(/\r?\n/).forEach(function(n){
      n=n.replace(/\s+/g," ").trim();
      if(n&&!have[n.toLowerCase()]){have[n.toLowerCase()]=1;S.siswa.push({id:uid(),nama:n});added++}
    });
    if(added){commit()}
    setStatus(added?added+" siswa ditambahkan":"Tidak ada nama baru");
    renderSiswa();
  }
});
view.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="cari"){q=t.value;renderList();return}
  if(t.dataset&&t.dataset.skor){
    var sm=mById(curMapel());if(!sm)return;
    var ssid=t.dataset.sid,scid=t.dataset.skor,raw0=t.value.trim();
    if(!sm.skor[ssid])sm.skor[ssid]={};
    if(raw0===""){delete sm.skor[ssid][scid]}
    else if(/^[sia]$/i.test(raw0)){sm.skor[ssid][scid]=raw0.toUpperCase()}
    else{
      var sv=parseFloat(raw0.replace(",","."));
      if(!isFinite(sv))return;
      if(sv<0){sv=0;t.value="0"}
      if(sv>100){sv=100;t.value="100"}
      sm.skor[ssid][scid]=sv;
    }
    if(!Object.keys(sm.skor[ssid]).length)delete sm.skor[ssid];
    commit();refreshCalc(sm,ssid,scid);return;
  }
  if(t.dataset&&t.dataset.rket){
    if(!S.ket)S.ket={};
    if(t.value)S.ket[t.dataset.rket]=t.value;else delete S.ket[t.dataset.rket];
    commit();return;
  }
  if(t.dataset&&t.dataset.ket){
    var li=t.closest("[data-sid]");if(!li)return;
    var c=find(li.dataset.sid,R.tgl,t.dataset.ket);
    if(c){c.ket=t.value;commit()}
  }
});
view.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="berkas"){if(t.files&&t.files[0])readBackup(t.files[0])}
  else if(t.id==="tema"){try{localStorage.setItem(TEMA,t.value)}catch(e){}applyTema(t.value)}
  else if(t.id==="set-kkm"){var k1=parseFloat(t.value);if(isFinite(k1)&&k1>=0&&k1<=100){S.kkm=k1;commit()}else t.value=S.kkm}
  else if(t.id==="set-ambang"){var k2=parseInt(t.value,10);if(isFinite(k2)&&k2>=0&&k2<=99){S.ambang=k2;commit()}else t.value=S.ambang}
  else if(t.id&&t.id.indexOf("p-")===0){
    var pk={"p-sekolah":"sekolah","p-kelas":"kelas","p-tahun":"tahun","p-wali":"wali"}[t.id];
    if(pk){if(!S.profil)S.profil={};S.profil[pk]=t.value.replace(/\s+/g," ").trim();commit();updateSub()}
  }
  else if(t.dataset&&t.dataset.colname){
    var cm3=mById(curMapel()),cc=cm3&&cm3.cols.find(function(c){return c.id===t.dataset.colname});
    if(cc){var nn=t.value.replace(/\s+/g," ").trim();if(nn){cc.nama=nn;commit()}else t.value=cc.nama}
  }
  else if(t.dataset&&t.dataset.bobot){
    var bm=mById(curMapel());
    if(bm){
      var bw=parseFloat(t.value),bk=t.dataset.bobot;
      bm.bobot=bm.bobot||{};
      if(isFinite(bw)&&bw>0)bm.bobot[bk]=Math.min(100,bw);else delete bm.bobot[bk];
      if(!Object.keys(bm.bobot).length)delete bm.bobot;
      commit();renderNilai();
    }
  }
  else if(t.id==="impfile"){if(t.files&&t.files[0])readImport(t.files[0])}
  else if(t.id==="sisfile"){if(t.files&&t.files[0])readNames(t.files[0])}
  else if(t.dataset&&t.dataset.impchk!==undefined&&imp){imp.items[+t.dataset.impchk].sel=t.checked;renderNilai()}
  else if(t.dataset&&t.dataset.impname!==undefined&&imp){imp.items[+t.dataset.impname].name=t.value.replace(/\s+/g," ").trim();renderNilai()}
  else if(t.dataset&&t.dataset.impmode&&imp){imp.mode=t.dataset.impmode;renderNilai()}
  else if(t.id==="impnew"&&imp){imp.addNew=t.checked;renderNilai()}
  else if(t.id==="mapel"){selMapel=t.value;confirmKey=null;renderNilai()}
  else if(t.id==="kkm"){var kv=parseFloat(t.value);if(isFinite(kv)&&kv>=0&&kv<=100){S.kkm=kv;commit()}renderRNilai()}
  else if(t.id==="tgl"&&t.value){R.tgl=t.value;renderSum();renderList()}
  else if(t.id==="dari"&&t.value){R.dari=t.value;if(R.dari>R.sampai)R.sampai=R.dari;renderRekap()}
  else if(t.id==="sampai"&&t.value){R.sampai=t.value;if(R.dari>R.sampai)R.dari=R.sampai;renderRekap()}
  else if(t.id==="ambang"){var n=parseInt(t.value,10);if(isFinite(n)&&n>=0&&n<=99){S.ambang=n;commit()}renderRekap()}
});

/* ---------- bilah geser tabel ---------- */
function enhanceScroll(){
  document.querySelectorAll(".tw-top").forEach(function(e){e.remove()});
  document.querySelectorAll(".tw").forEach(function(w){
    var t=w.querySelector("table");
    if(!t||t.scrollWidth<=w.clientWidth+1)return;
    var top=document.createElement("div");
    top.className="tw-top";top.setAttribute("aria-hidden","true");
    var inner=document.createElement("div");
    inner.style.width=t.scrollWidth+"px";
    top.appendChild(inner);
    w.parentNode.insertBefore(top,w);
    top.addEventListener("scroll",function(){if(w.scrollLeft!==top.scrollLeft)w.scrollLeft=top.scrollLeft},{passive:true});
    w.addEventListener("scroll",function(){if(top.scrollLeft!==w.scrollLeft)top.scrollLeft=w.scrollLeft},{passive:true});
  });
}
var scrollTimer=0;
function queueScroll(){cancelAnimationFrame(scrollTimer);scrollTimer=requestAnimationFrame(enhanceScroll)}
try{new MutationObserver(queueScroll).observe(view,{childList:true})}catch(e){}
window.addEventListener("resize",queueScroll);
window.addEventListener("load",queueScroll);

try{applyTema(getTema())}catch(e){}
render();
initData();
})();
</script>
